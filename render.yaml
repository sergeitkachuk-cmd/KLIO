services:
  - type: web
    name: klio
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm start
    healthCheckPath: /api/ai-status
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: klio-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: YANDEX_SEARCH_API_KEY
        sync: false
      - key: YANDEX_FOLDER_ID
        sync: false
      # Comma-separated emails allowed to open /admin (users, plan usage,
      # AI spend). Leave unset and nobody can open it.
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "KLIO <onboarding@resend.dev>"
      - key: APP_BASE_URL
        value: https://klio-g1eg.onrender.com

databases:
  - name: klio-db
    plan: free
