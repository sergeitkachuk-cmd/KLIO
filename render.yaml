services:
  - type: web
    name: klio
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm start
    healthCheckPath: /api/ai-status
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: klio-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # "openai" or "deepseek" — switches every AI operation at once (see
      # app/api/_lib/ai-config.ts). Leave unset/anything else and it stays
      # on OpenAI — the DeepSeek integration is additive, not a replacement.
      # Set to deepseek to match the value actually configured on the live
      # Render service (this file previously said openai, which a fresh
      # deploy from this blueprint would have silently reverted to).
      - key: AI_PROVIDER
        value: deepseek
      - key: YANDEX_SEARCH_API_KEY
        sync: false
      - key: YANDEX_FOLDER_ID
        sync: false
      # Bounded Tavily search for content-plan grounding. The value is set
      # only in Render and must never be committed to this blueprint.
      - key: TAVILY_API_KEY
        sync: false
      # Comma-separated emails allowed to open /admin (users, plan usage,
      # AI spend). Leave unset and nobody can open it.
      - key: ADMIN_EMAILS
        sync: false
      - key: UNISENDER_GO_API_KEY
        sync: false
      - key: UNISENDER_FROM_EMAIL
        sync: false
      - key: UNISENDER_BACKEND_ID
        sync: false
      - key: APP_BASE_URL
        value: https://цифроваяредакция.рф

databases:
  - name: klio-db
    plan: free
